<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 135" width="100%" height="100%">
  <defs>
    <!-- Gradient for V: Bright Orange to Coral Pink -->
    <linearGradient id="vamV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="60%" stop-color="#FF334B" />
      <stop offset="100%" stop-color="#FF1E62" />
    </linearGradient>

    <!-- Gradient for A: Hot Pink/Magenta to Violet -->
    <linearGradient id="vamA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA006E" />
      <stop offset="65%" stop-color="#C800A1" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>

    <!-- Gradient for M: Violet/Purple to Electric Royal Blue -->
    <linearGradient id="vamM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8338EC" />
      <stop offset="50%" stop-color="#5E43F3" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>
  </defs>

  <g id="VAMTechLogo">
    <!-- Letter V -->
    <path
      d="M 22 36 L 56 90 C 58 94 66 94 68 90 L 102 36"
      fill="none"
      stroke="url(#vamV)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter A -->
    <path
      d="M 112 90 L 144 36 C 146 32 154 32 156 36 L 188 90"
      fill="none"
      stroke="url(#vamA)"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Circle in A -->
    <circle cx="150" cy="78" r="9.5" fill="#FF4400" />

    <!-- Letter M -->
    <path
      d="M 200 90 L 200 40 C 200 33 209 33 213 40 L 229 64 C 231 67 235 67 237 64 L 253 40 C 257 33 266 33 266 40 L 266 90"
      fill="none"
      stroke="url(#vamM)"
      stroke-width="14.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Vertical Separator Divider -->
    <line
      x1="285"
      y1="28"
      x2="285"
      y2="98"
      stroke="#0062FF"
      stroke-width="2.8"
      stroke-linecap="round"
    />

    <!-- Wordmark: Tech -->
    <text
      x="298"
      y="92"
      font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
      font-size="68"
      font-weight="500"
      fill="#0062FF"
      letter-spacing="-0.5px"
    >Tech</text>

    <!-- Subtitle / Tagline -->
    <text
      x="230"
      y="126"
      font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
      font-size="11.5"
      font-weight="600"
      letter-spacing="3.4px"
      text-anchor="middle"
      fill="#475569"
    >
      TECHNOLOGY <tspan fill="#FF6B00" font-weight="700"> • </tspan> SOLUTIONS <tspan fill="#FA006E" font-weight="700"> • </tspan> INNOVATION
    </text>
  </g>
</svg>
