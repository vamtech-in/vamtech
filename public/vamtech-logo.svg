<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 136" width="100%" height="100%">
  <defs>
    <!-- Gradient for V: Warm Orange to Red-Pink -->
    <linearGradient id="vamV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="55%" stop-color="#FF2E4C" />
      <stop offset="100%" stop-color="#FF185D" />
    </linearGradient>

    <!-- Gradient for A: Hot Magenta-Pink to Royal Violet -->
    <linearGradient id="vamA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FA006E" />
      <stop offset="60%" stop-color="#B500B8" />
      <stop offset="100%" stop-color="#872CE2" />
    </linearGradient>

    <!-- Gradient for M: Vivid Purple to Electric Royal Blue -->
    <linearGradient id="vamM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8338EC" />
      <stop offset="45%" stop-color="#5B45F5" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>
  </defs>

  <g id="VAMTechLogo">
    <!-- Letter V -->
    <path
      d="M 22 35 L 56 91 C 58.5 95 65.5 95 68 91 L 102 35"
      fill="none"
      stroke="url(#vamV)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter A -->
    <path
      d="M 112 91 L 144 35 C 146.5 31 153.5 31 156 35 L 188 91"
      fill="none"
      stroke="url(#vamA)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center Circle in A -->
    <circle cx="150" cy="78" r="9" fill="#FF4400" />

    <!-- Letter M -->
    <path
      d="M 200 91 L 200 39 C 200 32 209 32 213 39 L 230 65 C 232 68 236 68 238 65 L 255 39 C 259 32 268 32 268 39 L 268 91"
      fill="none"
      stroke="url(#vamM)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Vertical Separator Divider -->
    <line
      x1="288"
      y1="26"
      x2="288"
      y2="98"
      stroke="#0062FF"
      stroke-width="2.8"
      stroke-linecap="round"
    />

    <!-- Wordmark: Tech -->
    <text
      x="302"
      y="91"
      font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="70"
      font-weight="500"
      fill="#0062FF"
      letter-spacing="-0.5px"
    >
      Tech
    </text>

    <!-- Subtitle / Tagline: TECHNOLOGY • SOLUTIONS • INNOVATION -->
    <text
      x="230"
      y="127"
      font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="11.5"
      font-weight="600"
      letter-spacing="4.2px"
      text-anchor="middle"
      fill="#475569"
    >
      TECHNOLOGY <tspan fill="#FF6B00" font-weight="700"> • </tspan> SOLUTIONS <tspan fill="#FA006E" font-weight="700"> • </tspan> INNOVATION
    </text>
  </g>
</svg>
